<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>VLC.ID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0057B7">
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script defer src="script.js"></script>
</head>

<body class="bg-gray-100 text-center p-6 select-none" 
      oncontextmenu="return false" 
      oncopy="return false" 
      oncut="return false" 
      onpaste="return false" 
      onkeydown="return false">

  <h1 class="text-4xl font-bold text-blue-700 mb-4">VLC.ID</h1>
  <p class="mb-6 text-gray-600">Увійди, щоб побачити захищені дані</p>

  <div class="max-w-md mx-auto">
    <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded mb-3">
    <input type="password" id="password" placeholder="Пароль" class="w-full p-2 border rounded mb-4">
    <button onclick="login()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded w-full">Увійти</button>
  </div>

</body>
</html>
